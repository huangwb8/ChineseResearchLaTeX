skill_info:
  name: nsfc-justification-writer
  version: 1.5.0
  description: "全自动撰写、重构、审查和润色 NSFC/科研基金立项依据；宿主 AI 负责理解与改写，脚本负责引用、路径和安全写入。"
  category: writing
  author: "Bensz Conan"

# 只影响措辞和证据重心，不作为结构通过条件。
style:
  mode: theoretical

# 作为宿主 AI 的默认软预算；用户明确给出的篇幅要求优先，不能以压缩预算删除必要事实、限定或引用。
structure:
  canonical_status_title: "国内外研究现状"
  research_significance:
    preferred_paragraphs: 2
    max_paragraphs: 3
    max_body_ratio: 0.25
  thematic_subsection:
    preferred_paragraphs: 1
    max_paragraphs: 2
  summary:
    preferred_paragraphs: 1

parameters:
  project_root:
    type: string
    required: true
    description: 项目根目录

targets:
  # 可由项目配置或 CLI 显式指定；为空时由自动候选发现决定。
  justification_tex: ""
  bib_globs:
    - references/*.bib
    - references/**/*.bib

workspace:
  runs_dir: .bensz-api/task-{yyyymmdd-hhmm}-{简短描述}/nsfc-justification-writer

limits:
  max_file_size_mb: 5
  word_target:
    min: 100
    max: 20000

references:
  # 缺失 bibkey 仍记录为事实风险；自动流程不暂停询问，宿主 AI 应优先改写为可核验表述。
  allow_missing_citations: false

guardrails:
  # 自动写入仍受白名单、禁写路径和备份保护；自定义目标必须同步声明白名单。
  allowed_write_files:
    - extraTex/1.1.立项依据.tex
  forbidden_write_files:
    - main.tex
    - extraTex/@config.tex
  forbidden_write_globs:
    - "**/*.cls"
    - "**/*.sty"
  output_mode: auto_apply
  require_explicit_confirmation: false
  auto_select_target: true
  auto_create_target: true
  auto_retry_body_only: true

quality:
  # 夸大或绝对化表述由宿主 AI 按 references/quality_control.md 语义复核；
  # Python 不维护固定短语表，也不对正文措辞做硬编码判定。
  # 结构命令由 preview 的变更范围检查比较前后差异；不对现有正文中的命令逐字报警。
  avoid_commands: []

word_count:
  target: 9000
  tolerance: 800
  mode: cjk_only
