skill_info:
  name: nsfc-justification-writer
  version: 1.3.2
  description: "全自动撰写、重构、审查和润色 NSFC/科研基金立项依据；按研究意义—研究现状及发展动态—小结的内容链执行，自动完成目标选择、Tier1+Tier2、保守假设、成稿、备份与写入，不在中途要求用户确认或审核。"
  category: writing
  author: "Bensz Conan"

# 只影响措辞和证据重心，不作为结构通过条件。
style:
  mode: theoretical

parameters:
  project_root:
    type: string
    required: true
    description: 项目根目录

targets:
  # 可由项目配置或 CLI 显式指定；为空时由自动候选发现决定。
  justification_tex: ""
  bib_globs:
    - references/*.bib
    - references/**/*.bib

workspace:
  runs_dir: .bensz-api/task-{yyyymmdd-hhmm}-{简短描述}/nsfc-justification-writer

limits:
  max_file_size_mb: 5
  word_target:
    min: 100
    max: 20000

ai:
  enabled: true
  cache_dir: .bensz-api/task-{yyyymmdd-hhmm}-{简短描述}/nsfc-justification-writer/cache/ai

prompts:
  review_suggestions: assets/prompts/review_suggestions.txt
  writing_coach: assets/prompts/writing_coach.txt

references:
  # 缺失 bibkey 仍记录为事实风险；自动流程不暂停询问，宿主 AI 应优先改写为可核验表述。
  allow_missing_citations: false

guardrails:
  # 自动写入仍受白名单、禁写路径和备份保护；自定义目标必须同步声明白名单。
  allowed_write_files:
    - extraTex/1.1.立项依据.tex
  forbidden_write_files:
    - main.tex
    - extraTex/@config.tex
  forbidden_write_globs:
    - "**/*.cls"
    - "**/*.sty"
  output_mode: auto_apply
  require_explicit_confirmation: false
  auto_select_target: true
  auto_create_target: true
  auto_retry_body_only: true

quality:
  # 吹牛式表述由宿主 AI 按 references/boastful_expression_guidelines.md 语义复核；
  # Python 不维护固定短语表，也不对正文措辞做硬编码判定。
  # 结构命令由 preview 的变更范围检查比较前后差异；不对现有正文中的命令逐字报警。
  avoid_commands: []

# 仅保留用户显式要求时的独立预警；默认不进行开篇 300 字或固定页数/文献数判定。
constraints: {}

word_count:
  target: 9000
  tolerance: 800
  mode: cjk_only

writing_coach:
  enable_ai_stage_inference: true
  ai_inference_mode: auto
  fallback_rules:
    draft_threshold_ratio: 0.4
    draft_min_chars: 600

slr_integration:
  enabled: true
  marker_folder: ".systematic-literature-review"
  read_only: true
  validate_citations: true
  tex_patterns:
    - "*.tex"
    - "*_review.tex"
  bib_patterns:
    - "*.bib"
    - "*_参考文献.bib"
    - "references.bib"
