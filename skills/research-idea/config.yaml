skill_info:
  name: "research-idea"
  version: "0.5.0"
  description: "先通过文献雷达、论文解读和研究脉络 map 建立领域背景，再由多 agent 提出候选科学问题与可证伪假设，分开判断科学价值与近期投入，通过 Premium 查新与独立审查形成推荐、无合格候选或证据不足结论。"
  author: "Bensz Conan"
  category: "research"

workspace:
  task_root_dir: ".bensz-api"
  task_prefix: "task"
  task_label: "research-idea"
  workspace_contract: "bensz-api-task-v1"
  run_prefix: ""
  timestamp_format: "%Y%m%d-%H%M"
  keep_intermediates_inside_hidden_dir: true
  subdirs:
    - "input"
    - "output"
    - "log"
    - "theme"
    - "research-literature-radar"
    - "research-literature-interpretation"
    - "research-map"
    - "candidates"
    - "novelty"
    - "parallel-vibe"
    - "agent-reviews"
    - "synthesis"
    - "drafts"
    - "logs"

dependencies:
  required_skills:
    - "research-topic-extractor"
    - "research-literature-radar"
    - "research-literature-interpretation"
    - "research-literature-review"
    - "parallel-vibe"
  legacy_skill_aliases:
    research-topic-extractor:
      - "get-review-theme"
    research-literature-review:
      - "systematic-literature-review"
  systematic_literature_review_tier: "Premium"
  search_roots:
    - "."
    - "~/.codex/skills"
    - "~/.claude/skills"
    - "/Volumes/2T01/Cache/.codex/skills"

iteration:
  default_rounds: 3
  default_independent_agents: 3
  interpretation:
    execution_mode: "parallel-subagents"
    one_paper_per_agent: true
    max_concurrent_agents: 3
    concurrency_scope: "interpretation-subagents-only"
    batch_overflow: true
    nested_parallel_agents: false
  # 以下数量仅用于初始探索，最终保留数量由 outcome 决定。
  min_candidates: 3
  max_candidates: 7
  max_reexplorations: 1
  novelty_statuses:
    - "未研究"
    - "部分研究但关键缺口存在"
    - "已充分研究"
    - "未定"

output:
  default_dir: "docs/ideas"
  filename_template: "Research-Idea_{repo}_{pr}_{timestamp}.md"
  timestamp_format: "%Y%m%d%H%M%S"
  unsafe_filename_chars: "/\\:*?\"<>|"
  fallback_repo: "repo"
  fallback_pr: "manual"
  report_contract: "research-idea-report-v2"
  common_sections: ["结论与研究目标", "研究脉络 map 摘要", "候选评估", "查新摘要", "风险与下一步"]
  outcomes:
    recommended:
      min_candidates: 1
      sections: ["推荐与投入排序"]
    no_qualified:
      min_candidates: 0
      sections: ["淘汰理由与重启条件"]
    insufficient:
      min_candidates: 0
      sections: ["证据缺口与恢复位置"]
  # 旧报告只读兼容，不可据此认证新运行完成。
  required_sections:
    - "研究脉络 map 摘要"
    - "多个科学问题-科学假设对"
    - "为什么选择这些科学问题-科学假设对"
    - "最佳科学问题-科学假设对"
    - "查新摘要"
    - "风险与下一步"

validation:
  forbidden_path_patterns:
    - "\\.bensz-api(?:[\\\\/]|$)"
    - "\\.research-idea(?:[\\\\/]|$)"
    - "tests[\\\\/]research-idea(?:[\\\\/]|$)"
    - "\\.parallel-vibe(?:[\\\\/]|$)"
    - "\\.parallel_vibe(?:[\\\\/]|$)"
    - "parallel-vibe(?:[\\\\/]|$)"
    - "agent-reviews(?:[\\\\/]|$)"
    - "@main[\\\\/]summary\\.md"
    - "manifest\\.json"
    - "latest-run\\.txt"
    - "candidate-schema\\.json"
    - "runner\\.log"
    - "workspace_dir="
    - "manifest_path="
    - "test_dir="
    - "/(?:private/)?tmp/"
    - "/Volumes/"
  require_falsifiability_terms:
    - "可证伪"
    - "反证"
    - "推翻"
  min_question_hypothesis_pairs: 3
  v2_candidate_markers:
    - "科学问题"
    - "可证伪科学假设"
    - "关键预测"
    - "反证路径"
    - "价值与非平凡性"
    - "最近工作与实质增量"
    - "最强替代方向"
    - "判断可信度与近期投入"
    - "脉络依据"
    - "查新结论"
  required_candidate_markers:
    - "科学问题"
    - "可证伪科学假设"
    - "关键预测"
    - "反证路径"
    - "查新结论"
  required_best_markers:
    - "最佳选择"
    - "科学重要性"
    - "新颖性"
    - "可证伪性"
    - "可行性"

tests:
  default_dir: "tests/research-idea"

# 运行时版本为精确消费约束；Pack 版本唯一维护于对应 index.json。
runtime:
  kernel:
    name: bensz-skill-kernel
    version: "1.0.3"
  state_roots: [references/states]
  initial_state: bensz.research-ideation.literature
  states:
    - bensz.research-ideation.literature
    - bensz.research-ideation.candidates
    - bensz.research-ideation.review
    - bensz.research-ideation.reporting
    - bensz.research-ideation.completed
  verifiers:
    - id: bensz.research.stage-readiness
      version: "2.0.0"
      required: true

control:
  limits:
    max_evidence: 100
    max_file_bytes: 2097152
    max_request_bytes: 2097152
  forward:
    bensz.research-ideation.literature: bensz.research-ideation.candidates
    bensz.research-ideation.candidates: bensz.research-ideation.review
    bensz.research-ideation.review: bensz.research-ideation.reporting
    bensz.research-ideation.reporting: bensz.research-ideation.completed
  required_roles:
    bensz.research-ideation.candidates: [theme, radar, interpretation, map]
    bensz.research-ideation.review: [candidates, novelty]
    bensz.research-ideation.reporting: [review, synthesis]
    bensz.research-ideation.completed: [report]
