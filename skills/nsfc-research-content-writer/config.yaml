# ================================
# nsfc-research-content-writer 默认配置
# ================================

skill_info:
  name: nsfc-research-content-writer
  version: 1.1.0
  # template_year: 移除年份限制，使技能适用于不同年份的 NSFC 模板
  description: NSFC 研究内容、特色与创新、年度研究计划的新写、重构、审查与保真润色
  category: writing
  author: "Bensz Conan"

parameters:
  project_root:
    type: string
    required: true
    description: 项目根目录（如 projects/NSFC_Young 或你的标书项目路径）
  output_mode:
    type: string
    required: false
    default: apply
    allowed_values: [preview, apply]

targets:
  research_content_tex: extraTex/2.1.研究内容.tex
  innovation_tex: extraTex/2.2.特色与创新.tex
  yearly_plan_tex: extraTex/2.3.年度研究计划.tex

guardrails:
  allowed_write_files:
    - extraTex/2.1.研究内容.tex
    - extraTex/2.2.特色与创新.tex
    - extraTex/2.3.年度研究计划.tex
  forbidden_write_files:
    - main.tex
    - extraTex/@config.tex
  forbidden_write_globs:
    - "**/*.cls"
    - "**/*.sty"

quality_contract:
  subgoals_min: 3
  subgoals_max: 4
  innovation_min: 1
  innovation_max: 3
  plan_years: 3
  research_pages_min: 12
  research_pages_max: 15
  auxiliary_words_min: 12000
  auxiliary_words_max: 15000
  research_content_must_cover:
    - 研究问题与总体目标
    - 3–4 个可检验子目标（指标/对照/数据来源）
    - 研究内容与任务分解（对齐子目标）
    - 技术路线与学科适配的验证口径（机制干预/理论证明或反例/应用比较）
  innovation_must_be:
    - 可理解（评审能看懂）
    - 可对照（相对坐标系）
    - 可验证（至少有指标或验证实验）
  yearly_plan_must_include:
    - 三年分年任务（不跨年）
    - 里程碑与可交付成果（每年都有）

# scripts/check_project_outputs.py 的轻量自检参数（可选覆盖默认值）
checks:
  bibliography_globs:
    - "references/**/*.bib"
    - "bib/**/*.bib"
    - "*.bib"
  # 绝对化措辞：通常建议避免；脚本可扫描并给出 WARN/ERROR（见 --fail-on-risk-phrases）
  risk_phrases:
    - 首次
    - 领先
    - 填补空白
    - 突破性
    - 国际领先
    - 世界领先
  # deprecated：仅兼容读取并提示，不再参与任何判定；子目标由 AI 语义复核。
  subgoal_markers_min: 3
